# Messages configuration version. Used by the automatic migration system. Do not modify manually.
version: 1

# BVC customizable messages.
# Placeholders like {player} are replaced at runtime.

prefix: "&6[BVC] &7"

not_configured: "&cBackend is not configured. Edit plugin_data/BVC/config.yml and restart."
